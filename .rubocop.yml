AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - "test/dummy/**/*"
    - "vendor/**/*"
    - "bin/**/*"

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "lib/recording_studio_pages/built_ins.rb"
    - "lib/recording_studio_pages/admin.rb"

Metrics/ClassLength:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "app/controllers/**/*"
    - "lib/recording_studio_pages/engine.rb"
    - "lib/recording_studio_pages/field_schema.rb"

Metrics/ModuleLength:
  Exclude:
    - "lib/recording_studio_pages/built_ins.rb"
    - "lib/recording_studio_pages/admin.rb"

Metrics/MethodLength:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "app/components/**/*"
    - "app/controllers/**/*"
    - "lib/recording_studio_pages/services/**/*"
    - "lib/recording_studio_pages/built_ins.rb"
    - "lib/recording_studio_pages/field_schema.rb"
    - "lib/recording_studio_pages/renderer.rb"

Metrics/AbcSize:
  Exclude:
    - "test/**/*"
    - "lib/generators/**/*"
    - "app/components/**/*"
    - "app/controllers/**/*"
    - "lib/recording_studio_pages/services/**/*"
    - "lib/recording_studio_pages/field_schema.rb"

Metrics/ParameterLists:
  Exclude:
    - "lib/recording_studio_pages/services/**/*"
    - "lib/recording_studio_pages/section_definition.rb"

Metrics/CyclomaticComplexity:
  Exclude:
    - "lib/recording_studio_pages/field_schema.rb"
    - "lib/recording_studio_pages/services/**/*"

Metrics/PerceivedComplexity:
  Exclude:
    - "lib/recording_studio_pages/field_schema.rb"
    - "lib/recording_studio_pages/services/**/*"

Lint/EmptyBlock:
  Exclude:
    - "test/**/*"

Lint/NestedMethodDefinition:
  Exclude:
    - "test/**/*"

Naming/VariableNumber:
  Exclude:
    - "test/**/*"

Lint/MissingSuper:
  Exclude:
    - "app/components/**/*"
    - "lib/recording_studio_pages/services/**/*"
    - "test/services/**/*"

Lint/SuppressedException:
  Exclude:
    - "app/models/recording_studio_pages/page.rb"
